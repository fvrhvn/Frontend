<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ClassCart</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.8/dist/vue.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>ClassCart</h1>
            <div class="cart-info">
                Checkout
            </div>
        </header>

        <main>
            <section class="checkout">
                <h2>Checkout</h2>
                
                <div class="checkout-form">
                    <div class="form-group">
                        <label for="name">Full Name:</label>
                        <input v-model="checkoutForm.name" type="text" id="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input v-model="checkoutForm.email" type="email" id="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Phone Number:</label>
                        <input v-model="checkoutForm.phone" type="tel" id="phone" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="address">Address:</label>
                        <textarea v-model="checkoutForm.address" id="address" rows="3" required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="payment">Payment Method:</label>
                        <select v-model="checkoutForm.payment" id="payment" required>
                            <option value="">Select Payment Method</option>
                            <option value="credit">Credit Card</option>
                            <option value="debit">Debit Card</option>
                            <option value="paypal">PayPal</option>
                            <option value="bank">Bank Transfer</option>
                        </select>
                    </div>
                </div>
                
                <div class="order-summary">
                    <h3>Order Summary</h3>
                    <div v-for="item in cart" :key="item.id" class="order-item">
                        <span>{{ item.name }}</span>
                        <span>${{ item.price }}</span>
                    </div>
                    <div class="order-total">
                        <strong>Total: ${{ total }}</strong>
                    </div>
                </div>
                
                <div class="checkout-actions">
                    <button @click="goBackToCart" class="back-btn">Back to Cart</button>
                    <button @click="completeOrder" class="complete-btn">Complete Order</button>
                </div>
            </section>
        </main>
    </div>

    <script src="checkout.js"></script>
</body>
</html>
